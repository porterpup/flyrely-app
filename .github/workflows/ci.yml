name: CI
on:
  pull_request:
  # Phase 1 disruption copilot work lands on a long-lived branch; run CI there too.
  push:
    branches: [feat/disruption-copilot]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
        working-directory: ./
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (copilot flag off)
        run: npm run build
      - name: Check flag-off build has no copilot code
        run: sh scripts/check-copilot-sentinel.sh absent
      - name: Build (copilot flag on)
        run: npm run build
        env:
          VITE_FEATURE_DISRUPTION_COPILOT: "true"
      - name: Check flag-on build has copilot code
        run: sh scripts/check-copilot-sentinel.sh present
